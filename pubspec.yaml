name: labcontrol
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  mobile_scanner: ^5.2.3
  http: ^1.6.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/labcontrol_logo.png
    - assets/images/labcontrol_app_icon.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/labcontrol_app_icon.jpg"
  remove_alpha_ios: true
